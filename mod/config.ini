; CrystalClear
; Restart the game after changing these values.

; Master switch. 1 = on, 0 = leave the mic alone.
Enabled = 1

; How hard to push background noise down.
; 0 = off, 100 = aggressive. Default 60 is a solid start for fans,
; AC, and keyboard rattle without eating quiet speech.
; Range: 0-100.
Suppression = 60

; Optional fine-tuning. Leave commented to derive from Suppression.
; Linear amplitude for the noise gate (0.0-1.0). Higher = more noise cut.
; GateThreshold = 0.10
; Seconds for the gate to open when you start talking.
; AttackTime = 0.02
; Seconds for the gate to close after you stop.
; ReleaseTime = 0.18

; Set to 1 to log every re-apply in UE4SS.log.
Verbose = 0
